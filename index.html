<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twins Advance — Hitter Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="logo" src="site/assets/minnesota-twins.svg" alt="Minnesota Twins">
    <div class="brand-text">
      <strong>Twins Advance</strong>
      <span>Hitter tracking · 2026</span>
    </div>
  </div>
  <a class="tab" href="index.html">Hitter Sheet</a>
</header>
<main class="page">
  <h1>Hitter sheet</h1>
  <p class="print-head" id="print-head"></p>
  <p class="lede" id="subtitle"></p>
  <div class="controls">
    <label>Month
      <select id="month" aria-label="Month"></select>
    </label>
    <button type="button" class="export" id="export-pdf">Export PDF</button>
    <p class="status" id="status"></p>
  </div>
  <p class="note" id="roster"></p>
  <div class="groups" id="groups"></div>
  <p class="league" id="league"></p>
  <div class="wrap">
    <table id="sheet">
      <thead>
        <tr>
          <th>Hitter</th>
          <th>Contact</th>
          <th>In-zone whiff</th>
          <th>Chase</th>
          <th>Overall Execution<sup>2</sup></th>
          <th>RISP knock-in</th>
          <th>Move-over</th>
          <th>QAB</th>
          <th>PA</th>
          <th>Games</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <section class="footnotes">
    <p id="color"></p>
    <p id="footnote1"></p>
    <p id="footnote2"></p>
  </section>
</main>
<script src="js/sheet.js"></script>
</body>
</html>
